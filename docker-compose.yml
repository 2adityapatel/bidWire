version: "3.9"

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bidwire_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bidwire
      POSTGRES_PASSWORD: bidwire_pass
      POSTGRES_DB: bidwire_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidwire -d bidwire_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bidwire_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend instance 1 (port 3001) ──────────────────────────────────────────
  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bidwire_backend_1
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://bidwire:bidwire_pass@postgres:5432/bidwire_db
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Backend instance 2 (port 3002) ──────────────────────────────────────────
  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bidwire_backend_2
    restart: unless-stopped
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://bidwire:bidwire_pass@postgres:5432/bidwire_db
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
